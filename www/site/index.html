<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <title>Prisma — compartilhe sua tela com quem importa</title>
    <meta
      name="description"
      content="Mostre o seu jogo ou a sua tela para um grupo fechado de amigos. Transmita pelo app de Windows e assista de onde quiser: no computador, no navegador, no celular ou na TV. Grátis."
    />
    <meta name="theme-color" content="#1b1b1f" />

    <!-- Cartão de link (WhatsApp, Discord, Telegram).
         `og:image` é a ÚNICA URL absoluta do projeto inteiro, e é
         deliberada: quem lê isso não é o navegador na página, é o robô
         do WhatsApp/Discord buscando a imagem por fora. Vários deles
         não resolvem caminho relativo e simplesmente não mostram
         miniatura nenhuma. Se o domínio mudar, esta linha muda junto —
         é o preço de ter prévia de link funcionando. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Prisma — compartilhe sua tela com quem importa" />
    <meta
      property="og:description"
      content="Transmita o seu jogo do Windows e assista no computador, no navegador, no celular ou na TV. Salas privadas, por convite. Grátis."
    />
    <meta property="og:image" content="https://prisma-site.com.br/icon.png" />
    <meta property="og:url" content="https://prisma-site.com.br/" />
    <meta name="twitter:card" content="summary" />

    <!-- Poppins é a fonte do app (empacotada lá via @font-face). Aqui
         vem do Google Fonts pra não carregar os arquivos junto do
         bundle; `display=swap` deixa o texto aparecer na fonte de
         sistema enquanto ela baixa, em vez de a página ficar em branco. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-CNL2PJaL.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D0uDKCB7.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
