# Cabeçalhos que TODO bloco de proxy precisa. Existe como arquivo
# separado por causa de uma armadilha do nginx que não perdoa:
#
#   `proxy_set_header` NÃO é herdado por acumulação. Um `location` que
#   declara UM `proxy_set_header` próprio DESCARTA todos os que vieram
#   do nível de cima.
#
# Ou seja: bastaria o bloco do WebSocket declarar `Upgrade` e
# `Connection` pra perder Host, X-Real-IP, X-Forwarded-For e
# X-Forwarded-Proto — em silêncio, sem erro nenhum na config. Com um
# `include` explícito em cada bloco, isso não tem como acontecer por
# esquecimento.
#
# O X-Forwarded-For é o que o `app.set("trust proxy", 1)` do server.js lê
# pra recuperar o IP real de quem chamou. Sem ele o rate limiting
# (auth/rateLimit.js) fica cego e trata todo mundo como o mesmo cliente.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
