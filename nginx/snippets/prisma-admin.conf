# Tudo que o PAINEL DE ADMINISTRAÇÃO serve (2026-09-16), sem uma linha
# sobre TLS — mesmo arranjo do prisma-app.conf, pelo mesmo motivo: os
# dois templates (HTTP e HTTPS) precisam exatamente disto, e duplicar
# seria garantir que um dia divirjam.
#
# ---------------------------------------------------------------------
# POR QUE A API É PROXIADA AQUI TAMBÉM, EM VEZ DE O PAINEL CHAMAR
# https://prisma-site.com.br
#
# Porque assim o painel e a API ficam na MESMA ORIGEM
# (admin.prisma-site.com.br), e nada de CORS precisa existir: sem
# preflight, sem `Access-Control-Allow-*`, sem token atravessando
# origens. O app Electron nunca teve esse problema (chama do processo
# main, onde não há Origin); um site num navegador tem.
#
# E vem de brinde uma propriedade boa: as rotas `/admin/*` ficam
# alcançáveis SÓ por este hostname. No site público elas não existem.
# ---------------------------------------------------------------------

root /usr/share/nginx/html/admin;
index index.html;

# Painel de administração não vai pro Google. `always` porque a
# diretiva precisa valer inclusive nas respostas de erro.
add_header X-Robots-Tag "noindex, nofollow" always;

location / {
    # SPA: qualquer rota cai no index, que é quem decide o que mostrar.
    try_files $uri $uri/ /index.html;
}

# ⚠️ REGRA DO NGINX QUE PEGA TODO MUNDO: `add_header` declarado num
# `location` DESCARTA todos os add_header herdados do nível de cima —
# não soma, substitui. Por isso os dois blocos abaixo repetem o
# X-Robots-Tag: sem a repetição, justamente o index.html (a única página
# que um buscador indexaria) sairia sem ele.
#
# O `expires` não tem esse problema: ele gera o Cache-Control por
# mecanismo próprio, sem passar por add_header.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- Upload do instalador ------------------------------------------------
#
# A rota mais delicada do arquivo. Três ajustes, e nenhum é opcional:
#
#   client_max_body_size      o padrão do nginx é 1 MB e o resto do site
#                             usa 8 MB (foto de avatar). O instalador tem
#                             ~88 MB; sem isto o upload morre com 413.
#
#   proxy_request_buffering   DESLIGADO. Ligado (padrão), o nginx guarda
#                             os 88 MB INTEIROS em disco antes de mandar
#                             o primeiro byte pro Node — o dobro de
#                             escrita, o dobro de espera, e o servidor
#                             sem como recusar cedo um arquivo errado.
#                             Desligado, os bytes passam direto e a
#                             checagem do "MZ" derruba um upload errado
#                             nos primeiros milissegundos.
#
#   timeouts                  88 MB num link de 10 Mbps levam ~75s. O
#                             padrão de 60s cortaria o upload quase no
#                             fim, que é o pior lugar possível.
location /admin/version/upload {
    proxy_pass http://prisma_server:5000;
    include /etc/nginx/snippets/proxy-headers.conf;

    client_max_body_size 300m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# --- O resto da API que o painel usa -------------------------------------
#
# Lista curta de propósito: só o que o painel chama. Rota do app que não
# esteja aqui simplesmente não existe neste hostname — e é assim que se
# quer.
location /admin/  { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /login   { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /me      { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /version { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /avatars { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }

# --- Cabeçalhos de segurança ---------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_min_length 1024;
