# Tudo que o site serve, sem uma linha sobre TLS. Fica num snippet
# separado porque os dois templates (HTTP e HTTPS) precisam exatamente
# disto — duplicar seria garantir que um dia os dois divirjam e alguém
# passe uma tarde entendendo por que só funciona em http://.
#
# Não usa ${DOMAIN}: este arquivo NÃO passa pelo envsubst (só
# /etc/nginx/templates/*.template passa), então qualquer ${...} aqui
# chegaria literal no nginx.

# --- A landing page (arquivos estáticos) ---------------------------------
#
# Vem do bind mount ./www, que recebe o conteúdo de `dist/` do projeto
# prisma_webpage. Publicar o site é copiar arquivo, igual publicar o
# instalador — não existe build de site na VM.
#
# ⚠️ Subpasta `site/` desde 2026-09-16, quando o painel de
# administração entrou como SEGUNDO site no mesmo nginx. Cada um tem
# a sua pasta dentro de www/ e o seu `server` block:
#
#   www/site/   -> prisma-site.com.br        (esta)
#   www/app/    -> prisma-site.com.br/app    (o Prisma Web, mais abaixo)
#   www/admin/  -> admin.prisma-site.com.br  (prisma-admin.conf)
#
# Quem sobe o site precisa mover os arquivos que hoje estão soltos em
# www/ pra www/site/ no MESMO deploy desta config — ver DEPLOY-SITE.md.
root /usr/share/nginx/html/site;
index index.html;

location / {
    # Fallback pro index mesmo sendo uma página só: garante que
    # /qualquer-coisa não devolva 404 do nginx, e deixa a porta aberta
    # pra rotas de verdade no futuro sem mexer aqui.
    try_files $uri $uri/ /index.html;
}

# Os arquivos em /assets/ têm hash no nome (index-Brc0RZQ_.css) — o
# conteúdo nunca muda sob o mesmo nome, então cachear pra sempre é
# seguro E é o que faz a segunda visita ser instantânea.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# O index.html, ao contrário, NÃO pode ser cacheado: é ele que aponta
# pros arquivos com hash novo. Cacheado, a pessoa continuaria recebendo
# a versão antiga do site depois de um deploy, e o cache "pra sempre"
# acima viraria um tiro no pé.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# --- O PRISMA WEB (2026-09-30) -------------------------------------------
#
# O app de ASSISTIR as lives pelo navegador (projeto prisma_site_app).
# Vem do bind mount ./www, subpasta `app/` — a terceira ao lado de
# `site/` (landing page) e do `admin/`, que tem server block próprio.
#
# Um CAMINHO e não um subdomínio, ao contrário do painel. O painel é
# outro site, com outro público; este é o mesmo produto do mesmo domínio,
# e servir de `/app/` dá duas coisas de graça:
#
#   1. MESMA ORIGEM que a API. Sem CORS, sem preflight, e o WebSocket de
#      salas (`/ws/rooms`, logo abaixo) conecta sem nenhuma exceção de
#      configuração.
#   2. Nenhuma mexida no certificado. Um subdomínio exigiria `--expand`
#      no Let's Encrypt e mais um server block — duas coisas a mais pra
#      dar errado, pra resolver o que um `location` resolve.
#
# `root` e não `alias`: a pasta se chama literalmente `app/` dentro de
# html/, então `root` + o prefixo do location dão o caminho certo — e
# `alias` combinado com `try_files` tem armadilhas conhecidas que aqui
# não precisam existir.
location /app/ {
    root /usr/share/nginx/html;
    # O app é uma página só com navegação interna: qualquer caminho sob
    # /app/ que não seja um arquivo volta o index, e o JavaScript decide
    # o que mostrar.
    try_files $uri $uri/ /app/index.html;
}

# Sem a barra final o nginx cairia no `location /` do site e devolveria
# a landing page — o redirecionamento é o que faz "prisma-site.com.br/app"
# digitado à mão funcionar.
#
# `absolute_redirect off` deixa o Location RELATIVO (`/app/` em vez de
# `https://prisma-site.com.br/app/`). Com o absoluto, o nginx remonta a
# URL a partir do `$host` e da porta que ELE acha que está escutando — e
# atrás de um proxy ou numa porta não padrão isso sai errado (visto num
# teste local: a porta simplesmente sumia do Location). Relativo, o
# navegador resolve contra a URL atual e acerta sempre.
location = /app {
    absolute_redirect off;
    return 301 /app/;
}

# Mesma regra de cache do site, aplicada à subpasta: nomes com hash
# podem ser cacheados pra sempre, o index nunca.
location /app/assets/ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /app/index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";

    # ⚠️ Os três cabeçalhos abaixo são uma REPETIÇÃO dos que estão no fim
    # deste arquivo, e precisam estar aqui.
    #
    # `add_header` não acumula: um `add_header` dentro de um `location`
    # DESCARTA todos os herdados do nível de cima. Como este bloco define
    # o `Cache-Control`, ele perderia os de segurança — e justo nesta
    # página, que é o app logado (o `X-Frame-Options` é o que impede
    # alguém de embutir o Prisma num iframe e colher cliques).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# --- Proxy pro prisma_server ---------------------------------------------
#
# Desde 2026-09-10 a API INTEIRA passa por aqui — o `ports: 5000` do
# prisma_server saiu do docker-compose.yml, então este é o ÚNICO caminho
# de fora pra dentro. `prisma_server` é o nome do serviço no Compose e
# resolve pelo DNS interno da rede do Docker.
#
# ⚠️ Esta config e o `app.set("trust proxy", 1)` do server.js são um par.
# Ligar o trust proxy com a 5000 publicada abriria o buraco que ele
# existe pra fechar (bastaria bater direto na 5000 forjando o
# X-Forwarded-For). Ver o comentário no topo de auth/rateLimit.js.
#
# O que NÃO passa por aqui, de propósito:
#   - sinalização do LiveKit (ws://…:5880) — proxiar sinalização de
#     WebRTC só acrescenta um ponto de falha no caminho de entrar numa
#     sala; a mídia já é criptografada por DTLS-SRTP. O app usa o
#     DOMÍNIO com a porta explícita, que resolve o problema de IP fixo
#     sem pôr nada no meio.
#   - mídia (UDP 60000-60100) e WHIP (:5080 + UDP 5885) — nginx não
#     proxia UDP, e o LiveKit anuncia o próprio endereço no payload ICE.
#     Ver o cabeçalho do docker-compose.yml: remapear porta de mídia já
#     causou um bug real de ICE travado em "checking".
#   - webhook do LiveKit — vai por http://prisma_server:5000/webhook na
#     rede interna do Docker (livekit.yaml), nunca sai pra fora.

# Upload de foto de avatar (PUT /users/:id/avatar). O padrão do nginx é
# 1 MB — uma foto comprimida em webp passa longe disso, mas se um dia
# passar, o 413 chegaria no app como um erro sem explicação.
client_max_body_size 8m;

# WebSocket de salas em tempo real. Dois clientes passam por aqui: o app
# Electron (src/main/rooms.ts) e o Prisma Web (src/api/realtime.ts), que
# manda o JWT por SUBPROTOCOLO porque o navegador não deixa definir
# header no handshake — ver `tokenDoHandshake` no server.js. O nginx
# repassa o `Sec-WebSocket-Protocol` junto do resto do handshake, então
# não há nada a configurar pra isso.
#
# O `proxy_read_timeout` longo é o detalhe que não é óbvio: essa conexão
# fica OCIOSA entre eventos, e o padrão do nginx (60s) a derrubaria. O
# sintoma seria a lista de salas parar de atualizar sozinha depois de um
# minuto parado e voltar ao mexer — bem chato de diagnosticar.
location /ws/rooms {
    proxy_pass http://prisma_server:5000;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
}

# --- Sinalização do LiveKit em wss:// (2026-09-16) -----------------------
#
# Entrou por causa do app Android (viewer em Flutter): o Android 9+ recusa
# tráfego em texto claro por padrão, e o `ws://prisma-site.com.br:5880` que
# o app Windows usa simplesmente não conecta lá. Liberar cleartext no
# manifesto resolveria — e mandaria o JWT do LiveKit aberto pela rede de
# quem estiver numa TV em Wi-Fi público.
#
# O PRISMA WEB (2026-09-30) usa este mesmo caminho, e pra ele não havia
# alternativa nenhuma: uma página em https:// não consegue abrir um
# ws://, o navegador bloqueia como conteúdo misto antes mesmo de tentar.
#
# ⚠️ ISTO NÃO MUDA NADA DO QUE JÁ EXISTE. A porta 5880 continua publicada
# e o app Windows continua falando direto com ela, sem passar por aqui.
# Este bloco só ACRESCENTA um segundo caminho pra mesma sinalização:
#
#   ws://prisma-site.com.br:5880      <- app Windows (como sempre)
#   wss://prisma-site.com.br/livekit  <- app Android e Prisma Web
#
# No dia em que o Windows migrar, é trocar uma string em config.ts — e o
# caminho novo já vai estar testado em produção pelo Android.
#
# A barra no fim do `proxy_pass` é o que tira o prefixo: o cliente pede
# /livekit/rtc e o LiveKit recebe /rtc, que é o que ele espera. Sem ela,
# chegaria /livekit/rtc e daria 404 numa conexão que nunca completa.
#
# Só a SINALIZAÇÃO passa por aqui. A mídia continua indo direto por UDP
# (60000-60100), porque o LiveKit anuncia o próprio IP no payload ICE —
# ver o cabeçalho do docker-compose.yml, onde remapear porta de mídia já
# causou um bug real de ICE travado em "checking".
location /livekit/ {
    proxy_pass http://livekit-server:5880/;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Mesmo arranjo do /ws/rooms logo acima: sem estes três o upgrade pra
    # WebSocket não acontece e a conexão morre como um HTTP comum.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # A sinalização fica ABERTA e OCIOSA durante toda a live — os eventos
    # são esparsos depois que a sala entra no ar. Com o padrão de 60s, o
    # nginx derrubaria a conexão no meio de quem está assistindo quieto.
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
}

# O instalador, com tratamento próprio por causa do tamanho.
location /downloads/ {
    proxy_pass http://prisma_server:5000/downloads/;
    include /etc/nginx/snippets/proxy-headers.conf;

    # As três linhas que importam pra um arquivo de ~90 MB: sem elas o
    # nginx BUFFERIZA a resposta inteira em disco antes de mandar o
    # primeiro byte. O download parece travado por vários segundos e o
    # disco da VM leva uma cópia do instalador a cada visitante.
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 300s;
}

# O resto da API, rota por rota. Não dá pra usar um `location /` genérico
# aqui: esse prefixo já é do SITE (o try_files lá em cima). Então cada
# prefixo que pertence ao Express é declarado — nginx casa pelo prefixo
# MAIS LONGO, então estes vencem o `/` do site.
#
# ⚠️ Rota nova no server.js precisa entrar aqui também. Esquecer não dá
# erro: o pedido cai no `location /`, o nginx devolve o index.html do
# site com 200, e o app recebe HTML onde esperava JSON.
#
# A lista bate com os `app.get/post/put/use` do server.js em 2026-09-10,
# com UMA ausência de propósito: `/webhook`. Ele é chamado pelo LiveKit
# por http://prisma_server:5000/webhook DENTRO da rede do Docker
# (livekit.yaml) e não tem por que ser alcançável de fora — expor só
# daria a estranhos um endpoint pra martelar, mesmo com a assinatura
# sendo verificada.
location /login    { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /register { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /me       { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /password-reset { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /users    { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
# Amizades (2026-10-21, ver friends.js).
location /friends  { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /rooms    { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /token    { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /ingress  { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /version  { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /avatars  { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /games    { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }
location /ping     { proxy_pass http://prisma_server:5000; include /etc/nginx/snippets/proxy-headers.conf; }

# --- Cabeçalhos de segurança ---------------------------------------------
#
# O básico que não custa nada e não quebra nada num site estático. CSP
# fica de fora de propósito: a página carrega a fonte do Google Fonts, e
# uma CSP mal calibrada quebraria isso em silêncio — vale a pena, mas
# como passo próprio, testado.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_types text/css application/javascript image/svg+xml application/json;
gzip_min_length 1024;
