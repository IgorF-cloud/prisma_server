# Arquivo VAZIO de propósito. Ele é montado por cima do
# /etc/nginx/conf.d/default.conf que a imagem oficial do nginx traz.
#
# Aquele default.conf declara `server_name localhost` e serve a página
# de boas-vindas do nginx. Como casamento EXATO de server_name vence
# `default_server`, ele sequestrava qualquer requisição feita com
# `Host: localhost` — que é exatamente o que acontece quando alguém
# testa de dentro da própria VM com `curl http://localhost/login`. O
# resultado era 404 nas rotas de API e a página do site nas outras,
# sugerindo um erro de config que não existia. Descoberto testando, em
# 2026-09-10.
#
# Só apagar o arquivo não resolveria: ele volta a cada `docker compose
# up`, porque vem dentro da imagem. Montar um vazio por cima é o jeito
# de neutralizá-lo sem fazer build de imagem própria.
