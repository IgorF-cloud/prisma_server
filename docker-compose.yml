# Stack de produção (VM na nuvem) do servidor do **Prisma** (pasta
# prisma_server, serviço `prisma_server` abaixo) — Redis, LiveKit Server,
# LiveKit Ingress e o próprio prisma_server, tudo em Docker, em rede bridge
# (padrão do Compose) com todas as portas necessárias publicadas
# explicitamente abaixo.
#
# Clonado em 2026-09-08 do servidor do TaOnPlay
# (D:\MY PROJECTS\_nodeServer\token_api) mantendo **os mesmos IPs e as mesmas
# portas**, por pedido explícito. Consequência prática: as duas stacks NÃO
# rodam ao mesmo tempo na mesma VM — o segundo `docker compose up` falha no
# bind de todas as portas abaixo. Antes de subir esta, ou derruba a do
# token_api, ou desloca as portas daqui (respeitando a regra do ICE
# explicada mais abaixo: as de MÍDIA precisam ser iguais dentro e fora do
# container), ou usa outra VM. Ver item 4 do ROADMAP.md do Prisma.
#
# Ingress+Redis voltaram (2026-08-30) — a versão Electron migrou a
# captura de tela pro pipeline GStreamer/WHIP (ver MEMORIA.md do
# Electron), que precisa dos dois de novo, igual o app Flutter antigo
# (ver D:\MY PROJECTS\node\token-server\docker-compose.yml, usado como
# referência pra completar este arquivo).
#
# Portas do LADO DE FORA (host) deslocadas de propósito (2026-08-31) —
# essa stack roda em PARALELO com o servidor antigo na MESMA VM (pra
# testar sem derrubar o que já está no ar): todo mundo +2000 em cima da
# porta "de fábrica" de cada serviço.
#
# EXCEÇÃO IMPORTANTE (bug real encontrado em produção, 2026-08-31): as
# portas de MÍDIA/ICE (rtc.tcp_port, rtc.port_range_*, ingress udp_port)
# NÃO PODEM ser remapeadas (interno != externo) — o LiveKit/Ingress
# anuncia a porta que ELE PRÓPRIO conhece (a interna) dentro do payload
# ICE que manda pro cliente (GStreamer/livekit-client); se o Docker
# remapeia por fora, o cliente tenta conectar na porta interna errada e o
# ICE trava pra sempre em "checking" (sintoma: sem erro nenhum na hora de
# iniciar a live, mas o ingress cai pouco depois com "source encoder not
# ready", e a sala nunca aparece pro viewer porque a publicação nunca
# completa de verdade). Por isso essas 3 (tcp_port do LiveKit, o range de
# mídia do LiveKit, e o udp_port do Ingress) usam a MESMA porta dentro e
# fora — só as portas puramente HTTP/WS (sinalização do LiveKit, endpoint
# WHIP do Ingress, RTMP) são seguras pra deslocar, porque a URL/porta é
# sempre passada explicitamente (LIVEKIT_WS_URL, whip_base_url em
# livekit.yaml) em vez de embutida num protocolo.
#
# Resumo do que cada porta virou (fábrica → externa) — 2026-08-31: o
# usuário pediu pra igualar TODAS (interna = externa em tudo, não só nas
# 3 que precisam por causa do ICE), então as que eram só remapeadas por
# fora (sinalização, WHIP HTTP, RTMP) tiveram a porta INTERNA também
# trocada pra bater (livekit.yaml `port:`, `ws_url`/`whip_port`/
# `rtmp_port` do Ingress abaixo, e `LIVEKIT_SERVER_URL` no .env) — sem
# isso, `prisma_server`/`livekit-ingress` (que falam com o `livekit-server`
# DIRETO pela rede interna do Docker, sem passar pelo mapeamento do
# host) tentam a porta errada e dá ECONNREFUSED / "Não foi possível
# criar o ingress".
#   3000→5000 (prisma_server — interna TAMBÉM virou 5000, em .env PORT=
#              5000 e no webhook.urls do livekit.yaml, que fala com o
#              prisma_server pela rede interna do Docker)
#   7880→5880 (sinalização LiveKit — interna TAMBÉM virou 5880, em
#              livekit.yaml `port:` e no `LIVEKIT_SERVER_URL`/`ws_url`
#              usados pelas chamadas internas)
#   7881→5881 (ICE-TCP fallback do LiveKit — NÃO É SEGURO remapear, ver
#              acima; por isso interna TAMBÉM virou 5881 em livekit.yaml)
#   8080→5080 (endpoint HTTP do WHIP — interna TAMBÉM virou 5080, em
#              `whip_port` do Ingress abaixo)
#   7885→5885 (mídia UDP do WHIP — NÃO É SEGURO remapear; interna também
#              virou 5885 na config do Ingress abaixo)
#   1935→5935 (RTMP, não usado — interna também virou 5935 por
#              consistência, em `rtmp_port` do Ingress abaixo)
#   50000-50100→60000-60100 (mídia UDP do LiveKit — NÃO É SEGURO
#              remapear; o range interno também virou 60000-60100 em
#              livekit.yaml)
#
# Por que bridge + `ports:` em vez de `network_mode: host`: com host
# networking o Docker NÃO abre nada no firewall do próprio Linux (só o
# `ports:` do Docker faz esse furo automático via iptables) — então mesmo
# com o firewall/grupo de segurança da VM liberado, o firewall interno do
# host podia continuar bloqueando. Com `ports:`, o Docker cuida da parte
# do host sozinho; falta só liberar essas mesmas portas no firewall/grupo
# de segurança da VM (lista abaixo) e, se houver NAT/roteador na frente,
# fazer o port-forward delas também.
#
# Uso:
#   cd prisma_server
#   docker compose up -d --build
#
# As variáveis (HOST, PORT, LIVEKIT_*, TOKEN_API_SECRET) vêm do .env
# desse mesmo diretório — o Docker Compose carrega automaticamente um
# arquivo ".env" ao lado deste arquivo.
#
# Portas que precisam estar abertas no firewall/grupo de segurança da VM
# (e no roteador, se a VM estiver atrás de NAT) — já com o deslocamento
# acima:
#   - ~~5000/tcp~~     — NÃO abrir mais (2026-09-10). A API entra pelo
#                        nginx (80/443); a 5000 nem é publicada pelo
#                        Compose. Deixá-la aberta com o
#                        `app.set("trust proxy", 1)` ligado no server.js
#                        é um buraco — ver o comentário no serviço
#                        prisma_server e o topo de auth/rateLimit.js
#   - 5880/tcp        — sinalização do LiveKit (WebSocket). Continua
#                        direto, sem proxy: o app fala
#                        ws://prisma-site.com.br:5880 (domínio, mas nada
#                        no meio do caminho)
#   - 5881/tcp        — ICE/TURN fallback (TCP) do LiveKit
#   - 60000-60100/udp — mídia (RTP/ICE) do LiveKit — ajuste o range aqui
#                        se precisar de mais participantes simultâneos
#   - 5080/tcp        — endpoint HTTP do WHIP (ingress) — é pra onde o
#                        GStreamer do host publica a transmissão
#   - 5885/udp        — mídia (RTP/ICE) do WHIP (ingress)
#   - 5935/tcp        — RTMP (só se um dia usar RTMP em vez de WHIP; pode
#                        deixar fechado enquanto só usar WHIP)
#   - 80/tcp          — nginx (site). NÃO PODE ficar fechada nem depois
#                        do HTTPS: é por ela que o Let's Encrypt valida o
#                        domínio, na emissão E a cada renovação
#   - 443/tcp         — nginx (site em HTTPS)
#
# 80 e 443 são as duas ÚNICAS portas desta stack que não seguem o
# deslocamento +2000 explicado acima — navegador não digita porta, e um
# site em :2080 não é um site. Nenhuma das duas conflita com a stack do
# token_api, que não usa nem uma nem outra.

services:
  # Banco (2026-09-10) — substituiu o data/userList.json e o version.json.
  #
  # SEM `ports:` de propósito: só a rede interna do Compose alcança. O
  # prisma_server é vizinho dele aqui dentro, então não há motivo pra
  # expor a 5432 na VM — e assim isto NÃO entra no conflito de portas com
  # a stack do token_api (ver o cabeçalho deste arquivo e o item 10 do
  # ROADMAP).
  #
  # O volume `pgdata` guarda TUDO: as tabelas E os dados. Não existe
  # "volume do schema" separado — apagar este volume apaga todos os
  # usuários. Por isso mudanças de schema entram como migration (arquivo
  # novo em db/migrations/, aplicado no boot do prisma_server), e nunca
  # como "apaga o volume e sobe de novo".
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` (dois cifrões) e não `$`: com um só, o COMPOSE interpola a
      # variável a partir do .env — onde ela não existe (lá os nomes são
      # PGUSER/PGDATABASE) — e o comando vira `pg_isready -U -d`, sem
      # usuário nem banco. Corrigido em 2026-09-10; com `$$` a expansão
      # acontece dentro do container, onde POSTGRES_USER/POSTGRES_DB
      # realmente existem (foram definidos logo acima).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5379:6379"

  # VERSÃO FIXA DESDE 2026-10-20 — não volte pra `latest`.
  #
  # A v1.13.7 (a que o `latest` tinha baixado e que ficou parada no cache
  # da VM, porque `up --build` não faz pull) tem um panic em
  # IOInfoService.UpdateIngressState (ioservice_ingress.go:82): quando um
  # host encerra a live, o DeleteIngress corre contra o aviso de estado
  # do próprio Ingress, o LoadIngress devolve a info com State nil, e o
  # processo INTEIRO cai. Junto vão TODAS as salas no ar — foi o
  # "fulano parou a live e derrubou a de todo mundo" de 12/10 e 20/10.
  # Corrigido upstream no livekit/livekit#4806, que saiu na v1.13.10.
  #
  # Pra atualizar: troque a tag aqui, `docker compose pull livekit-server`
  # e `up -d`. Com tag fixa, a versão que roda é a que está escr+-+ita aqui.
  livekit-server:
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    ports:
      - "5880:5880/tcp"
      - "5881:5881/tcp"
      - "60000-60100:60000-60100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    command: ["--config", "/etc/livekit.yaml"]
    depends_on:
      - redis

  livekit-ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    ports:
      - "5080:5080/tcp"
      - "5885:5885/udp"
      - "5935:5935/tcp"
    depends_on:
      - redis
      - livekit-server
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit-server:5880
        redis:
          address: redis:6379
        rtmp_port: 5935
        whip_port: 5080
        rtc_config:
          udp_port: 5885
          # Em rede bridge a auto-detecção pega o IP interno do Docker em
          # vez do IP público real — sem isso o 'url' que o CreateIngress
          # devolve pro WHIP vem vazio/errado. Atualizar se o IP da VM
          # mudar (ver também HOST no .env e node_ip aqui precisam bater).
          node_ip: ${HOST}
        logging:
          level: info

  prisma_server:
    build: .
    restart: unless-stopped
    # SEM `ports:` desde 2026-09-10 — a API passou a entrar SÓ pelo nginx
    # (443/80), que alcança este container pela rede interna do Compose,
    # sem precisar de porta publicada. Dá pra fechar a 5000 no firewall
    # da VM também.
    #
    # ⚠️ NÃO devolva essa porta sem tirar o `app.set("trust proxy", 1)`
    # do server.js no mesmo movimento. As duas coisas juntas são um
    # buraco: com a 5000 aberta dá pra ignorar o nginx e inventar o
    # próprio X-Forwarded-For, ganhando um balde de rate limit novo por
    # requisição. Explicação completa no topo de auth/rateLimit.js.
    #
    # ⚠️ Consequência pra quem já tinha o app instalado: instalações
    # feitas ANTES de 2026-09-10 apontam pra http://143.20.0.54:5000 e
    # param de funcionar aqui. O instalador novo apaga o config.json
    # antigo (seção [InstallDelete] do prisma.iss), então a primeira
    # atualização conserta a máquina — mas quem estiver numa build velha
    # demais pra se atualizar precisa reinstalar.
    # ./data continua bind mount mesmo depois do banco (2026-09-10): os
    # usuários saíram daqui pro Postgres, mas as FOTOS de avatar
    # (data/avatars/<id>.webp) e o cache da lista de jogos do Discord
    # continuam sendo arquivo. Como o server.js é copiado pra dentro da
    # imagem a cada build, sem este mount tudo isso se perderia no
    # próximo `docker compose up -d --build`.
    #
    # ./downloads: o instalador em si. Publicar uma versão nova é trocar o
    # .exe aqui e chamar PUT /version — sem rebuildar o container.
    #
    # O mount do ./version.json SAIU junto com o arquivo: a versão vive na
    # tabela app_version agora. Deixar o mount apontando pra um arquivo
    # inexistente faria o Docker criar uma PASTA chamada version.json no
    # host no próximo up.
    # ./ops: a caixa de correio do botão "Docker" do painel (2026-09-21).
    # A API escreve um pedido em ops/requests/ e lê de volta o log que o
    # script do HOST escreve em ops/logs/ — ver ops/README.md pro porquê
    # de o build não rodar aqui dentro.
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./ops:/app/ops
    env_file:
      - .env
    depends_on:
      # `service_healthy` (e não só o nome) porque o servidor roda as
      # migrations no boot: sem esperar o Postgres aceitar conexão, o
      # primeiro start morreria e ficaria em loop de restart. O runner
      # ainda tem uma espera própria por cima disso (db/index.js), pro
      # caso do initdb demorar mais que o healthcheck numa VM lenta.
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      livekit-server:
        condition: service_started

  # Site / landing page (2026-09-10) — projeto prisma_webpage, em
  # MY PROJECTS/react. Serve os arquivos estáticos e faz proxy de DUAS
  # rotas do prisma_server: /downloads (o instalador) e /version/public
  # (número da versão exibido no botão).
  #
  # A API do app NÃO passa por aqui de propósito. Colocá-la atrás do
  # nginx exigiria `app.set("trust proxy", 1)` no server.js — sem isso o
  # rate limiting (auth/rateLimit.js) passa a ver todas as requisições
  # vindo do IP do container do nginx e tranca TODO MUNDO junto no
  # primeiro excesso. Decisão: fazer isso como passo próprio, quando o
  # painel web (item 4) precisar.
  #
  # O conteúdo do site vem do bind mount ./www — não há build de site na
  # VM. Publicar é copiar o `dist/` pra lá, igual o instalador em
  # downloads/. Ver DEPLOY-SITE.md.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Neutraliza o default.conf que vem DENTRO da imagem — ver o
      # comentário no próprio arquivo. Sem isto, `curl localhost` de
      # dentro da VM não bate no site nem na API.
      - ./nginx/no-default.conf:/etc/nginx/conf.d/default.conf:ro
      # Os dois volumes do certbot. `certbot-www` é a pasta onde o
      # certbot escreve o arquivo do desafio e de onde o nginx serve
      # ele — os dois PRECISAM enxergar o mesmo volume, é o único ponto
      # de encontro entre eles.
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      # Substituído nos arquivos de nginx/templates pelo entrypoint da
      # imagem oficial. Preencher no .env quando o domínio existir.
      DOMAIN: ${DOMAIN}
      # Sem este filtro o envsubst também trocaria $host, $uri,
      # $remote_addr e companhia — que são variáveis DO NGINX — por
      # string vazia, e a config sairia quebrada de um jeito difícil de
      # enxergar.
      NGINX_ENVSUBST_FILTER: "DOMAIN"
    # ⚠️⚠️ A ARMADILHA DO `command` NA IMAGEM OFICIAL DO NGINX ⚠️⚠️
    #
    # Um comentário ANTERIOR aqui dizia que "o command sobrescreve só o
    # CMD, e o ENTRYPOINT (que roda o envsubst nos templates) continua
    # valendo". Está ERRADO, e custou um deploy travado em 2026-09-16.
    #
    # O entrypoint roda, sim — mas ele só processa os templates quando o
    # PRIMEIRO argumento é `nginx`. O /docker-entrypoint.sh da imagem faz
    # literalmente isto:
    #
    #     if [ "$1" = "nginx" ] || [ "$1" = "nginx-debug" ]; then
    #         ...roda tudo que está em /docker-entrypoint.d/...
    #     fi
    #     exec "$@"
    #
    # Com `command: /bin/sh -c "..."`, o `$1` é `/bin/sh`. O `if` não
    # entra, o envsubst NÃO roda, nenhum arquivo é gerado em conf.d/ e o
    # nginx sobe sem config nenhuma — com o ${DOMAIN} nunca substituído.
    #
    # A correção é reinvocar o entrypoint COM `nginx` na frente, que é o
    # que a linha abaixo faz. Assim volta a rodar tudo que está em
    # /docker-entrypoint.d/, e não só o envsubst: chamar
    # `/docker-entrypoint.d/20-envsubst-on-templates.sh` direto também
    # resolve o sintoma, mas deixa de fora os outros scripts da pasta
    # (resolvers locais, ajuste de worker_processes) e passa a depender
    # de um nome de arquivo que é detalhe interno da imagem.
    #
    # O `exec` no fim não é enfeite: sem ele o PID 1 é o `sh`, que não
    # repassa sinal nenhum — `docker compose stop` mandaria SIGTERM pro
    # shell e o nginx morreria no SIGKILL do timeout. Com `exec`, o
    # nginx É o PID 1 e recebe o sinal.
    #
    # O laço de reload existe porque o nginx carrega o certificado na
    # memória UMA vez: sem ele, a renovação automática do certbot troca
    # o arquivo em disco e o site continua servindo o certificado antigo
    # até vencer. Ele vai pra segundo plano ANTES do exec e sobrevive a
    # ele — processo em segundo plano não morre quando o pai se troca.
    #
    # 24h e não 6h (ajustado em 2026-09-10, quando o WebSocket de salas
    # passou a atravessar o nginx): um `reload` não derruba conexão
    # aberta — o nginx mantém os workers antigos vivos até elas
    # fecharem — mas conexões LONGAS, como o /ws/rooms de quem deixa o
    # app aberto o dia inteiro, seguram esses workers, e eles se
    # acumulam a cada reload. Renovação de certificado acontece a cada
    # ~60 dias; 6h era exagero, 24h é de sobra.
    command: >
      /bin/sh -c "(while :; do sleep 24h & wait $${!}; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'"
    depends_on:
      - prisma_server

  # Emissão e renovação do certificado (Let's Encrypt).
  #
  # A PRIMEIRA emissão é manual e feita uma vez só (ver DEPLOY-SITE.md) —
  # este serviço aqui cuida apenas da renovação, que roda a cada 12h e
  # não faz nada enquanto faltar mais de 30 dias pro vencimento.
  #
  # `$${!}` com dois cifrões: o Compose interpola `${...}` antes de
  # entregar a string pro shell, e `$!` (PID do último processo em
  # segundo plano) precisa chegar intacto no `sh`.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

# Volume nomeado (e não bind mount) pro Postgres: o diretório de dados
# dele precisa de permissões/ownership que um bind mount de pasta do
# host costuma atrapalhar. Fica sob controle do Docker — `docker volume
# ls` mostra, e um `docker compose down` NÃO apaga (só `down -v`).
volumes:
  pgdata:
  # Certificados e a config do Let's Encrypt. Volume nomeado, não bind
  # mount: tem chave privada dentro, com permissões que o certbot
  # gerencia. `docker compose down` NÃO apaga (só `down -v`) — o que
  # importa aqui, porque o Let's Encrypt limita a 5 emissões por semana
  # pro mesmo domínio, e perder isso à toa custa dias de espera.
  certbot-conf:
  # Pasta do desafio HTTP-01, compartilhada entre certbot (escreve) e
  # nginx (serve). Efêmera por natureza — os arquivos vivem segundos.
  certbot-www:
